[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent"
version = "0.1.0"
description = "AI Coding Agent Backend with FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "anyio>=4.6.2",
    "anthropic>=0.40.0",
    "openai>=1.54.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "slowapi>=0.1.9",
    "docker>=7.1.0",
    "psutil>=6.1.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "aiofiles>=24.1.0",
    "pathspec>=0.12.1",
    "GitPython>=3.1.43",
    "rich>=13.9.0",
    "prompt_toolkit>=3.0.50",
    "textual>=0.80",
    "typer>=0.13.0",
    "loguru>=0.7.2",
    "jsonschema>=4.23.0",
    "python-multipart>=0.0.6",
]
[project.scripts]
coding-agent = "coding_agent.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.7.4",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]